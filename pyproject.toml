[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbfjax"
version = "0.2.0"
description = "High-performance JAX implementation of Control Barrier Functions for safe control"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Amirsaeid Safari", email = "safari.amirsaeid@gmail.com"},
]
maintainers = [
    {name = "Amirsaeid Safari", email = "safari.amirsaeid@gmail.com"},
]
keywords = [
    "jax",
    "control-barrier-functions",
    "cbf",
    "safe-control",
    "robotics",
    "optimal-control",
    "model-predictive-control",
    "quadratic-programming",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "jax>=0.6.2",
    "jaxlib>=0.6.2",
    "equinox>=0.13.1",
    "diffrax>=0.7.0",
    "qpax>=0.0.9",
    "jaxopt>=0.8.3",
    "mpax>=0.2.0",
    "immutabledict>=4.2.1",
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Everything: optional solver backends plus development tooling.
# Note: acados (NMPC SQP backend) and trajax (iLQR) are not on PyPI and must be
# installed separately:
#   https://docs.acados.org/
#   pip install "trajax @ git+https://github.com/google/trajax.git"
dev = [
    "cvxopt>=1.3",
    "casadi>=3.6",
    "do-mpc>=4.6.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "twine>=4.0",
    "black>=22.0",
    "isort>=5.10",
    "mypy>=1.0",
    "ruff>=0.1",
    "pre-commit>=2.20",
]

[project.urls]
Homepage = "https://github.com/amirsaeid254/cbfjax"
Repository = "https://github.com/amirsaeid254/cbfjax"
Issues = "https://github.com/amirsaeid254/cbfjax/issues"
Changelog = "https://github.com/amirsaeid254/cbfjax/releases"

[project.scripts]
cbfjax-map-editor = "cbfjax.utils.run_map_editor:main"

# ---------------------------------------------------------------------------
# Setuptools configuration
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["."]
include = ["cbfjax*"]
exclude = ["tests*", "examples*", "flowbarrier*"]

[tool.setuptools.package-data]
cbfjax = ["py.typed", "utils/map_editor/*.html"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    examples
  | tests
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["examples/*", "tests/*", "build/*", "dist/*"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["examples", "tests", "build", "dist"]

[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
